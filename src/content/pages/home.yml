      text: "We learn your brand, your goals, and your customers before we touch a tactic."
    - title: "Strategize."
      text: "We build a clear, prioritized plan tied to the metrics that matter."
    - title: "Create & Launch."
      text: "Our team produces the creative and campaigns, then puts them live."
    - title: "Measure & Grow."
      text: "We report transparently, optimize continuously, and scale what works."

# --- Results (the dramatic dark section) ---
