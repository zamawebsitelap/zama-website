# --- SEO: browser tab title + Google/social description ---
seo:
  title: "ZAMA | Boutique Digital Marketing Agency in Washington, DC"
  description: "ZAMA is a boutique digital marketing agency helping Washington, DC and South Florida brands grow through strategy, creative, paid media, social, and SEO."
  keywords:
    - "boutique digital marketing agency"
    - "digital marketing Washington DC"
    - "South Florida marketing agency"
    - "brand strategy"
    - "paid media"
    - "social media marketing"
    - "email marketing"
    - "SEO services"

# --- Hero (the opening screen) ---
hero:
  h1: "Strategy, creative, and growth marketing for brands that are ready to be known."
  subhead: "Every brand deserves its dawn, its sunrise, its light. ZAMA exists for that moment - from first light to full warmth, we help brands rise."
  primaryCta:
    label: "Start a project"
    href: "/contact"
  secondaryCta:
    label: "Book an intro call"
    href: "https://calendly.com/christa-wearezama/30min?month=2026-07"
  # Swap this image in /public/images/ to change the hero visual.
  # To use your own photo: add it to /public/images/ (e.g. hero-portrait.jpg)
  # and point this line at it. Always update the alt text below too.
  image: "/images/savoir00001.jpg"
  imageAlt: "A real hero photo for ZAMA, a boutique digital marketing agency in Washington, DC."
  imageCaption: "Christa Machado, Founder of ZAMA"

# --- Positioning statement ---
positioning: "A boutique agency that takes brands from unseen to unmistakable, from the first light of an idea to the full warmth of being known. We bring strategy, creative, and growth together with senior attention and care."

# --- Services overview (core offerings for the homepage cards) ---
services:
  label: "WHAT WE DO"
  heading: "Four core offerings that move your brand forward."
  intro: "We keep your marketing focused and outcome-driven. No wall of disconnected services, just the work that grows your brand."
  offerings:
    - title: "Brand & Creative"
      outcome: "Clarify your position and turn it into creative that people remember."
    - title: "Growth Marketing"
      outcome: "Paid ads, SEO, email, and analytics that make your budget go further."
    - title: "Social & Community"
      outcome: "Build attention and loyalty with content and community people actually care about."
    - title: "PR & Events"
      outcome: "Earn meaningful visibility through media outreach, sponsorship outreach, and unforgettable event experiences."

# --- Selected work (case studies are pulled from src/content/work/) ---
