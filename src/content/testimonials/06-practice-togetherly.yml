quote: "Working with Christa at ZAMA has been such a positive experience. She creates great content and has a real talent for capturing high-quality photos and videos herself, which saved me the added expense of hiring a separate photographer or videographer. What really stood out to me, though, was how much Christa went above and beyond our contract. When I hosted an event in partnership with a local apartment building, she recognized what a great opportunity it was and came out to capture additional footage, even though it was beyond the photo session we had originally agreed upon. She also helped me grow as a business owner, coaching me on sales tactics and encouraging me to ask directly for what I wanted. She even joined a sales call with me, which was completely outside the scope of her work. Those experiences made it clear that Christa genuinely cares about my company and wants to see it succeed. She felt less like a marketing contractor and more like a true partner who was invested in helping me grow my business. As an early-stage founder, having someone like that in your corner is invaluable. I'm so grateful to have worked with her and would absolutely recommend Christa and ZAMA!"
